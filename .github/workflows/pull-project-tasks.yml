name: pull-project-tasks

on:
  workflow_dispatch: # Allows manual triggering of the workflow
    inputs:
      org_name:
        description: 'The name of the GitHub Organization containing the project'
        required: true
        default: ''
      project_name:
        description: 'The name of the GitHub Project to update'
        required: true
        default: ''
      source_owner:
        description: 'The owner of the source repository'
        required: true
        default: 'im-infomagnus'
      source_repo:
        description: 'The name of the source repository'
        required: true
        default: 'ms-code-with-engineering-playbook'
      target_owner:
        description: 'The owner of the target repository'
        required: true
        default: ''
      target_repo:
        description: 'The name of the target repository'
        required: true
        default: ''
      pat_secret:
        description: 'The name of the secret containing the PAT'
        required: true
        default: ''

jobs:
  update-project:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Authenticate with GitHub PAT
      env:
        GITHUB_TOKEN: ${{ secrets[inputs.pat_secret] }}
      run: |
        echo "Authenticated using PAT from secret: ${{ inputs.pat_secret }}"

    - name: Fetch Issues and Build Full Hierarchy
      id: fetch_hierarchy
      env:
        GITHUB_TOKEN: ${{ secrets[inputs.pat_secret] }}
        SOURCE_OWNER: ${{ inputs.source_owner }}
        SOURCE_REPO: ${{ inputs.source_repo }}
        TARGET_OWNER: ${{ inputs.target_owner }}
        TARGET_REPO: ${{ inputs.target_repo }}
      run: |
        # Rate limit checking function with exponential backoff
        check_rate_limit() {
          echo "Checking GitHub API rate limit..."
          
          # Get current rate limit status
          RATE_LIMIT_RESPONSE=$(gh api /rate_limit)
          REMAINING=$(echo "$RATE_LIMIT_RESPONSE" | jq -r '.rate.remaining')
          LIMIT=$(echo "$RATE_LIMIT_RESPONSE" | jq -r '.rate.limit')
          RESET_TIME=$(echo "$RATE_LIMIT_RESPONSE" | jq -r '.rate.reset')
          
          echo "API Rate Limit Status: $REMAINING remaining out of $LIMIT (resets at $(date -d @$RESET_TIME))"
          
          # Check if we're approaching the limit (less than 50 remaining)
          if [ "$REMAINING" -lt 50 ]; then
            echo "WARNING: API rate limit is low ($REMAINING remaining). Initiating backoff strategy..."
            
            local iteration=1
            local wait_time=30
            local max_iterations=10
            
            while [ $iteration -le $max_iterations ]; do
              echo "Backoff iteration $iteration/$max_iterations: waiting ${wait_time} seconds..."
              sleep $wait_time
              
              # Check rate limit again
              RATE_LIMIT_RESPONSE=$(gh api /rate_limit)
              NEW_REMAINING=$(echo "$RATE_LIMIT_RESPONSE" | jq -r '.rate.remaining')
              
              echo "Rate limit after wait: $NEW_REMAINING remaining"
              
              # Check if the limit increased by more than 100
              local increase=$((NEW_REMAINING - REMAINING))
              if [ $increase -gt 100 ]; then
                echo "Rate limit increased by $increase. Continuing with API calls..."
                return 0
              fi
              
              # If this is the last iteration and limit hasn't increased sufficiently
              if [ $iteration -eq $max_iterations ]; then
                echo "ERROR: Available API limit ceiling has been reached"
                exit 1
              fi
              
              # Double the wait time for next iteration
              wait_time=$((wait_time * 2))
              iteration=$((iteration + 1))
              REMAINING=$NEW_REMAINING
            done
          fi
          
          echo "Rate limit check passed. Proceeding with API call..."
        }
        # Initialize parent-child relationships file
        echo "{}" > parent_child_links.json
        
        # Initialize source-to-target issue mapping
        echo "{}" > source_target_mapping.json
        
        # Initialize broken URLs log
        echo "[]" > broken_urls.json

        # Validate JSON after initialization
        if ! jq empty parent_child_links.json; then
          echo "Error: parent_child_links.json contains invalid JSON. Reinitializing..."
          echo "{}" > parent_child_links.json
        fi

        # Recursive function to fetch sub-issues and build hierarchy
        fetch_subissues() {
          local issue_number=$1
          local parent_number=$2

          set +e  # Disable immediate exit on error
          echo "---------------------------------------------------------------------------"
          echo "Processing issue #$issue_number"

          # Fetch sub-issues for the current issue
          echo "Executing gh api graphql to fetch sub-issues for issue #$issue_number"
                              
          # Check rate limit before making API call
          check_rate_limit
          
          # Fetch the Global ID
          GET_ISSUE_ID_QUERY="query GetIssueId(\$owner: String!, \$repo: String!, \$issue_number: Int!) { repository(owner: \$owner, name: \$repo) { issue(number: \$issue_number) { id } } }"
          echo "GraphQL query to fetch issue ID: $GET_ISSUE_ID_QUERY"

          # Validate that issue_number is a valid integer
          if ! [[ "$issue_number" =~ ^[0-9]+$ ]]; then
            echo "Error: issue_number '$issue_number' is not a valid integer"
            return 1
          fi

          # Create a temporary file to capture error output
          ERROR_OUTPUT=$(mktemp)

          # Convert issue_number to a clean integer
          issue_number_int=$((10#$issue_number))  # Force base-10 interpretation
          echo "Using integer value for issue_number: $issue_number_int"

          # Check rate limit before direct curl GraphQL call
          check_rate_limit

          # Use alternative approach with direct curl to control JSON types properly
          ISSUE_ID_RESPONSE=$(curl -s -H "Authorization: bearer $GITHUB_TOKEN" \
            -X POST \
            -d "{\"query\":\"query { repository(owner: \\\"$SOURCE_OWNER\\\", name: \\\"$SOURCE_REPO\\\") { issue(number: $issue_number_int) { id } } }\"}" \
            https://api.github.com/graphql 2>$ERROR_OUTPUT)

          # Check for curl errors
          if [ $? -ne 0 ]; then
            echo "Error executing GraphQL query: $(cat $ERROR_OUTPUT)"
            return 1
          fi

          # Check for GraphQL errors in the response
          if echo "$ISSUE_ID_RESPONSE" | jq -e '.errors' >/dev/null 2>&1; then
            echo "GraphQL query returned errors:"
            echo "$ISSUE_ID_RESPONSE" | jq '.errors'
            return 1
          fi

          echo "GraphQL query executed successfully."
          echo "Raw response: $ISSUE_ID_RESPONSE"

          ISSUE_ID=$(echo "$ISSUE_ID_RESPONSE" | jq -r '.data.repository.issue.id')

          echo "Issue ID: $ISSUE_ID"

          # Try multiple GraphQL queries to find sub-issues
          echo "Executing GraphQL queries to fetch sub-issues for issue #$issue_number"
          
          # First try the original subIssues query
          QUERY1="query(\$issue_id: ID!) { node(id: \$issue_id) { ... on Issue { id number subIssues(first: 100) { nodes { id number title url } } } } }"
          echo "Trying subIssues field query: $QUERY1"
          
          # Check rate limit before GraphQL query
          check_rate_limit
          
          set +e  # Don't exit on error
          gh api graphql -f query="$QUERY1" -f issue_id="$ISSUE_ID" > subissues_response.json 2>/dev/null
          QUERY1_SUCCESS=$?
          set -e
          
          SUBISSUES=""
          if [ $QUERY1_SUCCESS -eq 0 ] && ! jq -e '.errors' subissues_response.json > /dev/null 2>&1; then
            echo "subIssues query successful"
            if jq -e '.data.node.subIssues.nodes' subissues_response.json > /dev/null 2>&1; then
              SUBISSUES=$(jq -c '.data.node.subIssues.nodes[]' subissues_response.json)
              if [ -n "$SUBISSUES" ]; then
                echo "Found sub-issues using subIssues field for issue #$issue_number:"
                echo "$SUBISSUES" | jq -r '.number'
              fi
            fi
          else
            echo "subIssues query failed or returned errors, trying alternative approach"
          fi
          
          # If subIssues didn't work, try timeline items and body parsing
          if [ -z "$SUBISSUES" ]; then
            QUERY2="query(\$issue_id: ID!) { node(id: \$issue_id) { ... on Issue { id number body timelineItems(first: 100, itemTypes: [CROSS_REFERENCED_EVENT]) { nodes { ... on CrossReferencedEvent { source { ... on Issue { id number title url } } } } } } } }"
            echo "Trying timeline items query: $QUERY2"
            
            # Check rate limit before GraphQL query
            check_rate_limit
            
            gh api graphql -f query="$QUERY2" -f issue_id="$ISSUE_ID" > subissues_response.json
            
            # Check if the response contains any errors
            if jq -e '.errors' subissues_response.json > /dev/null 2>&1; then
              echo "GraphQL query returned errors:"
              jq '.errors' subissues_response.json
              return 1
            fi

            echo "Raw response for alternative query:"
            cat subissues_response.json
            
            # Try cross-referenced issues from timeline
            if jq -e '.data.node.timelineItems.nodes' subissues_response.json > /dev/null 2>&1; then
              TIMELINE_ISSUES=$(jq -c '.data.node.timelineItems.nodes[] | select(.source.number != null) | .source' subissues_response.json)
              if [ -n "$TIMELINE_ISSUES" ]; then
                echo "Found cross-referenced issues for issue #$issue_number:"
                echo "$TIMELINE_ISSUES" | jq -r '.number'
                SUBISSUES="$TIMELINE_ISSUES"
              fi
            fi
            
            # If still no sub-issues, parse task list from body
            if [ -z "$SUBISSUES" ]; then
              ISSUE_BODY=$(jq -r '.data.node.body // ""' subissues_response.json)
              if [[ "$ISSUE_BODY" =~ \#[0-9]+ ]]; then
                echo "Found issue references in body, parsing task list..."
                # Extract issue numbers from task list items (- [ ] or - [x] #123)
                TASK_ISSUE_NUMBERS=$(echo "$ISSUE_BODY" | grep -oE -- '- \[[x ]\].*#[0-9]+' | grep -oE '#[0-9]+' | sed 's/#//' | sort -u)
                if [ -n "$TASK_ISSUE_NUMBERS" ]; then
                  echo "Found task list sub-issues: $TASK_ISSUE_NUMBERS"
                  # Convert to JSON format for consistency
                  SUBISSUES=""
                  for task_issue_num in $TASK_ISSUE_NUMBERS; do
                    # Create a JSON object for each task issue
                    TASK_ISSUE_JSON="{\"number\": $task_issue_num, \"title\": \"Task issue #$task_issue_num\", \"url\": \"https://github.com/$SOURCE_OWNER/$SOURCE_REPO/issues/$task_issue_num\"}"
                    if [ -z "$SUBISSUES" ]; then
                      SUBISSUES="$TASK_ISSUE_JSON"
                    else
                      SUBISSUES="$SUBISSUES\n$TASK_ISSUE_JSON"
                    fi
                  done
                fi
              fi
            fi
          fi
          
          if [ -z "$SUBISSUES" ]; then
            echo "No sub-issues found for issue #$issue_number using any method"
          else
            echo "Total sub-issues found for issue #$issue_number:"
            if command -v wc >/dev/null 2>&1; then
              SUBISSUE_COUNT=$(echo -e "$SUBISSUES" | wc -l)
              echo "Count: $SUBISSUE_COUNT"
            fi
            echo "Sub-issue details:"
            echo -e "$SUBISSUES" | jq -r '.number' 2>/dev/null || echo -e "$SUBISSUES"
          fi

          # # Check if response is empty first
          # if [ ! -s subissues_response.json ]; then
          #   echo "No sub-issues found for issue #$issue_number (empty response)"
          #   return
          # fi

          # # Check if response contains a 404 status
          # if jq -e '.status == "404"' subissues_response.json > /dev/null; then
          #   echo "No sub-issues found for issue #$issue_number (404 status)"
          #   return
          # fi

          # SUBISSUES=$(jq -c '.[]' subissues_response.json)

          # if [ -z "$SUBISSUES" ] || [ "$SUBISSUES" == "[]" ]; then
          #   echo "No sub-issues found for issue #$issue_number"
          #   return
          # fi

          # Process sub-issues if any were found
          if [ -n "$SUBISSUES" ]; then
            # Validate JSON before processing
            if ! jq empty parent_child_links.json; then
              echo "Error: parent_child_links.json contains invalid JSON."
              exit 1
            fi

            # Add the current issue to the hierarchy if not already present
            if ! jq -e --arg issue "$issue_number" 'has($issue)' parent_child_links.json > /dev/null; then
              jq --arg issue "$issue_number" '. + {($issue): []}' parent_child_links.json > temp.json \
              && mv temp.json parent_child_links.json
            fi

            # Link sub-issues to the current issue
            echo -e "$SUBISSUES" | while read -r subissue; do
              if [ -n "$subissue" ]; then
                SUBISSUE_NUMBER=$(echo "$subissue" | jq -r '.number')
                SUBISSUE_URL=$(echo "$subissue" | jq -r --arg source_owner "$SOURCE_OWNER" --arg source_repo "$SOURCE_REPO" '.url // "https://github.com/\($source_owner)/\($source_repo)/issues/\(.number)"')

                echo "Linking sub-issue #$SUBISSUE_NUMBER to parent issue #$issue_number"

                jq --arg parent "$issue_number" \
                  --arg number "$SUBISSUE_NUMBER" \
                  --arg url "$SUBISSUE_URL" \
                  '.[$parent] += [{"number": $number, "url": $url}]' \
                  parent_child_links.json > temp.json \
                && mv temp.json parent_child_links.json
              fi
            done

            echo "Contents of parent_child_links.json after processing issue #$issue_number:"
            cat parent_child_links.json
          fi
        }
        #end function

        TOP_LEVEL_ISSUES=$(mktemp)
        PAGE=1
        PER_PAGE=100

        echo "[]" > "$TOP_LEVEL_ISSUES"

        while : ; do
          echo "Executing gh api command: gh api \"/repos/$SOURCE_OWNER/$SOURCE_REPO/issues?state=open&per_page=$PER_PAGE&page=$PAGE\""
          
          # Check rate limit before API call
          check_rate_limit
          
          RESPONSE=$(gh api "repos/$SOURCE_OWNER/$SOURCE_REPO/issues?state=open&per_page=$PER_PAGE&page=$PAGE")
         
          #echo "Raw response for page $PAGE:"
          #echo "$RESPONSE"

          # Check if response is empty
          if [ -z "$RESPONSE" ]; then
            echo "Warning: Empty response from GitHub API. Assuming end of pages."
            break
          fi

          # Check if response is valid JSON
          if ! echo "$RESPONSE" | jq empty > /dev/null; then
            echo "Warning: Invalid JSON response from GitHub API. Assuming end of pages. Response was:"
            echo "$RESPONSE"
            break
          fi

          # Check if response is an empty array
          if [ "$(echo "$RESPONSE" | jq '. | length')" -eq 0 ]; then
            echo "No issues found on this page. Assuming end of pages."
            break
          fi

          # Append current page results to TOP_LEVEL_ISSUES
          jq -s '.[0] + .[1]' "$TOP_LEVEL_ISSUES" <(echo "$RESPONSE") > "${TOP_LEVEL_ISSUES}.tmp" && mv "${TOP_LEVEL_ISSUES}.tmp" "$TOP_LEVEL_ISSUES"

          PAGE=$((PAGE + 1))
        done

        echo "Top-level issues:"
        jq -r '.[].number' "$TOP_LEVEL_ISSUES"
        echo "Total top-level issues found: $(jq '. | length' "$TOP_LEVEL_ISSUES")"

        # Log the contents of the JSON file before parsing
        echo "Contents of parent_child_links.json before processing:"
        cat parent_child_links.json

        #raw response for top-level issues
        #echo "Raw response for top-level issues:"
        #cat "$TOP_LEVEL_ISSUES"

        # Process each top-level issue
        jq -c '.[]' "$TOP_LEVEL_ISSUES" | while read -r issue; do
          # Check if $issue is empty or null
          if [ -z "$issue" ] || [ "$issue" == "null" ]; then
            echo "Warning: Skipping empty or null issue."
            continue
          fi

          # Check if $issue is valid JSON
          if ! echo "$issue" | jq empty > /dev/null; then
            echo "Warning: Invalid JSON for issue: $issue"
            continue
          fi
          #echo "Issue: $issue" # Debugging statement

          # Check if the JSON object has a "number" field
          if echo "$issue" | jq -e 'has("number")' > /dev/null; then
            ISSUE_NUMBER=$(echo "$issue" | jq -r '.number')
          else
            echo "Warning: Issue does not have a 'number' field: $issue"
            continue
          fi


          # Check if ISSUE_NUMBER is empty
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "Warning: Issue number is empty for issue: $issue"
            continue
          fi

          echo "Processing top-level issue #$ISSUE_NUMBER"
          fetch_subissues "$ISSUE_NUMBER"
        done

        echo "Full parent-child hierarchy constructed and saved to parent_child_links.json."
        echo "Contents of parent_child_links.json after processing all issues:"
        cat parent_child_links.json

    - name: Add Issues to GitHub Project and Maintain Relationships
      id: add_issues
      env:
        GITHUB_TOKEN: ${{ secrets[inputs.pat_secret] }}
        SOURCE_OWNER: ${{ inputs.source_owner }}
        SOURCE_REPO: ${{ inputs.source_repo }}
        TARGET_OWNER: ${{ inputs.target_owner }}
        TARGET_REPO: ${{ inputs.target_repo }}
      run: |
        # Rate limit checking function with exponential backoff
        check_rate_limit() {
          echo "Checking GitHub API rate limit..."
          
          # Get current rate limit status
          RATE_LIMIT_RESPONSE=$(gh api /rate_limit)
          REMAINING=$(echo "$RATE_LIMIT_RESPONSE" | jq -r '.rate.remaining')
          LIMIT=$(echo "$RATE_LIMIT_RESPONSE" | jq -r '.rate.limit')
          RESET_TIME=$(echo "$RATE_LIMIT_RESPONSE" | jq -r '.rate.reset')
          
          echo "API Rate Limit Status: $REMAINING remaining out of $LIMIT (resets at $(date -d @$RESET_TIME))"
          
          # Check if we're approaching the limit (less than 50 remaining)
          if [ "$REMAINING" -lt 50 ]; then
            echo "WARNING: API rate limit is low ($REMAINING remaining). Initiating backoff strategy..."
            
            local iteration=1
            local wait_time=30
            local max_iterations=10
            
            while [ $iteration -le $max_iterations ]; do
              echo "Backoff iteration $iteration/$max_iterations: waiting ${wait_time} seconds..."
              sleep $wait_time
              
              # Check rate limit again
              RATE_LIMIT_RESPONSE=$(gh api /rate_limit)
              NEW_REMAINING=$(echo "$RATE_LIMIT_RESPONSE" | jq -r '.rate.remaining')
              
              echo "Rate limit after wait: $NEW_REMAINING remaining"
              
              # Check if the limit increased by more than 100
              local increase=$((NEW_REMAINING - REMAINING))
              if [ $increase -gt 100 ]; then
                echo "Rate limit increased by $increase. Continuing with API calls..."
                return 0
              fi
              
              # If this is the last iteration and limit hasn't increased sufficiently
              if [ $iteration -eq $max_iterations ]; then
                echo "ERROR: Available API limit ceiling has been reached"
                exit 1
              fi
              
              # Double the wait time for next iteration
              wait_time=$((wait_time * 2))
              iteration=$((iteration + 1))
              REMAINING=$NEW_REMAINING
            done
          fi
          
          echo "Rate limit check passed. Proceeding with API call..."
        }

        # Function to transform URLs from source to target repository
        transform_url() {
          local original_url="$1"
          local source_pattern="https://github.com/$SOURCE_OWNER/$SOURCE_REPO"
          local target_replacement="https://github.com/$TARGET_OWNER/$TARGET_REPO"
          
          if [[ "$original_url" == *"$source_pattern"* ]]; then
            echo "${original_url/$source_pattern/$target_replacement}"
          else
            echo "$original_url"
          fi
        }
        
        # Function to log broken URLs
        log_broken_url() {
          local broken_url="$1"
          local context="$2"
          echo "Logging broken URL: $broken_url (context: $context)"
          
          # Add to broken URLs log
          jq --arg url "$broken_url" --arg context "$context" \
            '. += [{"url": $url, "context": $context, "timestamp": now | todate}]' \
            broken_urls.json > broken_urls_temp.json && \
            mv broken_urls_temp.json broken_urls.json
        }

        PROJECT_NAME="${{ inputs.project_name }}"
        
        # Fetch the Project ID using v1 API
        echo "fetch the project ID"
        ORG_NAME="${{ inputs.org_name }}"
        PROJECT_NAME="${{ inputs.project_name }}"

        echo "Fetching project ID for project '$PROJECT_NAME' in organization '$ORG_NAME'"

        # Check rate limit before API call
        check_rate_limit

        # Fetch the Project ID using GraphQL API for Projects v2
        GRAPHQL_QUERY='query($org: String!) {
          organization(login: $org) {
            projectsV2(first: 100) {
              nodes {
                id
                title
              }
            }
          }
        }'

        API_RESPONSE=$(gh api graphql -f query="$GRAPHQL_QUERY" -f org="$ORG_NAME")
        
        # Check if the API response is valid JSON
        if ! echo "$API_RESPONSE" | jq empty > /dev/null 2>&1; then
          echo "Error: Invalid JSON response from GitHub API:"
          echo "$API_RESPONSE"
          exit 1
        fi
        
        echo "API response: ${API_RESPONSE}"

        PROJECT_ID=$(echo "$API_RESPONSE" | jq -r ".data.organization.projectsV2.nodes[] | select(.title==\"$PROJECT_NAME\") | .id")

        if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" == "null" ]; then
          echo "Error: Project '$PROJECT_NAME' not found in organization '$ORG_NAME'."
          exit 1
        fi

        echo "Project ID found: $PROJECT_ID"

        # Log the contents of the JSON file before adding issues
        echo "Contents of parent_child_links.json before adding issues to the project:"
        cat parent_child_links.json

        # Add all issues to the project
        for parent in $(jq -r 'keys_unsorted[]' parent_child_links.json); do
          echo "Adding issue #$parent to the project"
          
          # Check rate limit before GraphQL query for issue ID
          check_rate_limit
          
          # Get the issue ID using GraphQL (Global ID needed for Projects v2)
          ISSUE_QUERY='query($owner: String!, $repo: String!, $issueNumber: Int!) {
            repository(owner: $owner, name: $repo) {
              issue(number: $issueNumber) {
                id
              }
            }
          }'
          
          ISSUE_RESPONSE=$(gh api graphql -f query="$ISSUE_QUERY" -f owner="$SOURCE_OWNER" -f repo="$SOURCE_REPO" -F issueNumber="$parent")
          ISSUE_ID=$(echo "$ISSUE_RESPONSE" | jq -r '.data.repository.issue.id')
          echo "Issue Global ID: ${ISSUE_ID}"
          
          # Check rate limit before GraphQL mutation
          check_rate_limit
          
          # Add the issue to the project using GraphQL mutation for Projects v2
          ADD_MUTATION='mutation($projectId: ID!, $contentId: ID!) {
            addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
              item {
                id
              }
            }
          }'
          
          ADD_RESPONSE=$(gh api graphql -f query="$ADD_MUTATION" -f projectId="$PROJECT_ID" -f contentId="$ISSUE_ID")
          echo "Add response: $ADD_RESPONSE"
          
          echo "Issue #$parent added to the project"
        done

        # Log the contents of the JSON file before linking child issues
        echo "Contents of parent_child_links.json before linking child issues:"
        cat parent_child_links.json

        # Link child issues to their parents
        for parent in $(jq -r 'keys_unsorted[]' parent_child_links.json); do
          for child in $(jq -c --arg parent "$parent" '.[$parent][]' parent_child_links.json); do
            CHILD_NUMBER=$(echo "$child" | jq -r '.number')
            echo "Linking child issue #$CHILD_NUMBER to parent issue #$parent"
            
            # Check if child issue exists in target repository before linking
            # Check rate limit before REST API call
            check_rate_limit
            
            CHILD_CHECK_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$TARGET_OWNER/$TARGET_REPO/issues/$CHILD_NUMBER")
            
            if [ "$CHILD_CHECK_RESPONSE" = "200" ]; then
              # Check rate limit before REST API call
              check_rate_limit
              
              COMMENT_RESPONSE=$(curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                -d "{\"body\": \"Child of: #$parent\"}" \
                "https://api.github.com/repos/$TARGET_OWNER/$TARGET_REPO/issues/$CHILD_NUMBER/comments")
              
              # Check if the comment was created successfully
              if echo "$COMMENT_RESPONSE" | jq -e '.id' >/dev/null 2>&1; then
                echo "Child Issue #$CHILD_NUMBER linked to Parent Issue #$parent"
              else
                echo "Warning: Failed to link child issue #$CHILD_NUMBER to parent #$parent"
                log_broken_url "https://github.com/$TARGET_OWNER/$TARGET_REPO/issues/$CHILD_NUMBER" "Failed to create parent link comment"
              fi
            else
              echo "Warning: Child issue #$CHILD_NUMBER does not exist in target repository"
              log_broken_url "https://github.com/$TARGET_OWNER/$TARGET_REPO/issues/$CHILD_NUMBER" "Child issue does not exist in target repository (HTTP $CHILD_CHECK_RESPONSE)"
            fi
          done
        done

    - name: Update Parent Issues with Child Links
      env:
        GITHUB_TOKEN: ${{ secrets[inputs.pat_secret] }}
        SOURCE_OWNER: ${{ inputs.source_owner }}
        SOURCE_REPO: ${{ inputs.source_repo }}
        TARGET_OWNER: ${{ inputs.target_owner }}
        TARGET_REPO: ${{ inputs.target_repo }}
      run: |
        # Rate limit checking function with exponential backoff
        check_rate_limit() {
          echo "Checking GitHub API rate limit..."
          
          # Get current rate limit status
          RATE_LIMIT_RESPONSE=$(gh api /rate_limit)
          REMAINING=$(echo "$RATE_LIMIT_RESPONSE" | jq -r '.rate.remaining')
          LIMIT=$(echo "$RATE_LIMIT_RESPONSE" | jq -r '.rate.limit')
          RESET_TIME=$(echo "$RATE_LIMIT_RESPONSE" | jq -r '.rate.reset')
          
          echo "API Rate Limit Status: $REMAINING remaining out of $LIMIT (resets at $(date -d @$RESET_TIME))"
          
          # Check if we're approaching the limit (less than 50 remaining)
          if [ "$REMAINING" -lt 50 ]; then
            echo "WARNING: API rate limit is low ($REMAINING remaining). Initiating backoff strategy..."
            
            local iteration=1
            local wait_time=30
            local max_iterations=10
            
            while [ $iteration -le $max_iterations ]; do
              echo "Backoff iteration $iteration/$max_iterations: waiting ${wait_time} seconds..."
              sleep $wait_time
              
              # Check rate limit again
              RATE_LIMIT_RESPONSE=$(gh api /rate_limit)
              NEW_REMAINING=$(echo "$RATE_LIMIT_RESPONSE" | jq -r '.rate.remaining')
              
              echo "Rate limit after wait: $NEW_REMAINING remaining"
              
              # Check if the limit increased by more than 100
              local increase=$((NEW_REMAINING - REMAINING))
              if [ $increase -gt 100 ]; then
                echo "Rate limit increased by $increase. Continuing with API calls..."
                return 0
              fi
              
              # If this is the last iteration and limit hasn't increased sufficiently
              if [ $iteration -eq $max_iterations ]; then
                echo "ERROR: Available API limit ceiling has been reached"
                exit 1
              fi
              
              # Double the wait time for next iteration
              wait_time=$((wait_time * 2))
              iteration=$((iteration + 1))
              REMAINING=$NEW_REMAINING
            done
          fi
          
          echo "Rate limit check passed. Proceeding with API call..."
        }

        # Function to transform URLs from source to target repository
        transform_url() {
          local original_url="$1"
          local source_pattern="https://github.com/$SOURCE_OWNER/$SOURCE_REPO"
          local target_replacement="https://github.com/$TARGET_OWNER/$TARGET_REPO"
          
          if [[ "$original_url" == *"$source_pattern"* ]]; then
            echo "${original_url/$source_pattern/$target_replacement}"
          else
            echo "$original_url"
          fi
        }
        
        # Function to log broken URLs
        log_broken_url() {
          local broken_url="$1"
          local context="$2"
          echo "Logging broken URL: $broken_url (context: $context)"
          
          # Add to broken URLs log
          jq --arg url "$broken_url" --arg context "$context" \
            '. += [{"url": $url, "context": $context, "timestamp": now | todate}]' \
            broken_urls.json > broken_urls_temp.json && \
            mv broken_urls_temp.json broken_urls.json
        }

        # Log the contents of the JSON file before updating parent issues
        echo "Contents of parent_child_links.json before updating parent issues:"
        cat parent_child_links.json

        for parent in $(jq -r 'keys_unsorted[]' parent_child_links.json); do
          CHILD_LINKS=$(jq -r --arg parent "$parent" '.[$parent][] | "- [Issue #\(.number)](\(.url))"' parent_child_links.json | tr '\n' '\n')
          
          # Transform URLs in child links to point to target repository
          TRANSFORMED_CHILD_LINKS=""
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              TRANSFORMED_LINE=$(echo "$line" | sed "s|https://github.com/$SOURCE_OWNER/$SOURCE_REPO|https://github.com/$TARGET_OWNER/$TARGET_REPO|g")
              TRANSFORMED_CHILD_LINKS="$TRANSFORMED_CHILD_LINKS$TRANSFORMED_LINE"$'\n'
            fi
          done <<< "$CHILD_LINKS"
          
          echo "Updating parent issue #$parent with child links"
          
          # Check if issue exists in target repository before updating
          # Check rate limit before REST API call
          check_rate_limit
          
          ISSUE_CHECK_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$TARGET_OWNER/$TARGET_REPO/issues/$parent")
          
          if [ "$ISSUE_CHECK_RESPONSE" = "200" ]; then
            # Check rate limit before REST API call
            check_rate_limit
            
            PATCH_RESPONSE=$(curl -s -X PATCH \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "{\"body\": \"# Linked Child Issues\n$TRANSFORMED_CHILD_LINKS\"}" \
              "https://api.github.com/repos/$TARGET_OWNER/$TARGET_REPO/issues/$parent")
            
            # Check if the update was successful
            if echo "$PATCH_RESPONSE" | jq -e '.number' >/dev/null 2>&1; then
              echo "Parent Issue #$parent updated with child links."
            else
              echo "Warning: Failed to update parent issue #$parent"
              log_broken_url "https://github.com/$TARGET_OWNER/$TARGET_REPO/issues/$parent" "Failed to update parent issue"
            fi
          else
            echo "Warning: Parent issue #$parent does not exist in target repository"
            log_broken_url "https://github.com/$TARGET_OWNER/$TARGET_REPO/issues/$parent" "Parent issue does not exist in target repository (HTTP $ISSUE_CHECK_RESPONSE)"
          fi
        done
        echo "All parent issues updated with child links."
        
        # Display summary of broken URLs if any
        if [ -f broken_urls.json ] && [ "$(jq '. | length' broken_urls.json)" -gt 0 ]; then
          echo "BROKEN URLS DETECTED:"
          echo "====================="
          jq -r '.[] | "URL: \(.url) | Context: \(.context) | Time: \(.timestamp)"' broken_urls.json
          echo "====================="
          echo "Total broken URLs: $(jq '. | length' broken_urls.json)"
        else
          echo "No broken URLs detected."
        fi